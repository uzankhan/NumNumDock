[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "numnumdock"
version = "1.0.0"
description = "The LLM-aware secure deployment engine. Secure by default AI."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Your Name", email = "your@email.com" }
]
dependencies = [
    "typer",
    "rich",
    "docker",
    "fastapi",
    "uvicorn",
    "httpx",
    "pypiwin32; sys_platform == 'win32'"
]

[project.scripts]
numnumdock = "cli:app"

[tool.setuptools]
py-modules = ["cli"]
packages = ["core"]